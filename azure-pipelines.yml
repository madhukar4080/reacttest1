trigger:
- main

variables:
  azureSubscription: 'Azure subscription 1(1c29d824-9aa5-4286-9b2e-161e891c333f)'
  webAppName: 'reacttest1'

pool:
  name: Default

  

stages:

# =========================
# BUILD STAGE
# =========================
- stage: Build
  displayName: 'Build React App'
  jobs:
  - job: Build
    displayName: 'Build'
    steps:

    # Install Node.js
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    # Debug – show repo root (safe to keep or remove later)
    - script: |
        echo "===== REPO ROOT CONTENT ====="
        dir $(Build.SourcesDirectory)
      displayName: 'DEBUG: Show repo root'

    # Install dependencies and build React app
    - script: |
        npm install
        npm run build
        echo "===== BUILD OUTPUT ====="
        dir
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: 'Install dependencies & build React app'

    # Archive React build folder
    - task: ArchiveFiles@2
      displayName: 'Archive React build'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)\build'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)\react-build.zip'
        replaceExistingArchive: true

    # Publish build artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

# =========================
# DEPLOY STAGE
# =========================
- stage: Deploy
  displayName: 'Deploy to Azure Web App'
  dependsOn: Build
  jobs:
  - deployment: DeployReact
    displayName: 'Deploy React App'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          # Download artifact
          - download: current
            artifact: drop

          # Deploy to Azure Web App
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webApp'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)\drop\react-build.zip'
